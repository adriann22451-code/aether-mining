<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aether Mining</title>

  <!-- Telegram Mini App SDK — provides window.Telegram.WebApp (theme, CloudStorage, etc.) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tailwind CDN (JIT) — the game UI is built entirely with Tailwind utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- ES Module import map: React, ReactDOM, and lucide-react served as real ESM from esm.sh -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
      "react/jsx-dev-runtime": "https://esm.sh/react@18.2.0/jsx-dev-runtime",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
    }
  }
  </script>

  <!-- Babel Standalone — transforms the JSX in app.jsx in the browser (no build step needed) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #05050c;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #root {
      min-height: 100vh;
      min-height: 100dvh;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- data-type="module" tells Babel to transform JSX/modern syntax while keeping
       the import/export statements intact, so the browser runs it as a real ES module -->
  <script type="text/babel" data-type="module" data-presets="react" src="./app.jsx"></script>
</body>
</html>
